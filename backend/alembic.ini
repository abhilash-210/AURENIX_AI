# Alembic configuration for Aurenix AI backend.
# The [alembic] section is the only one Alembic itself reads.
# Application-specific values (like the database URL) are read by env.py
# from environment variables — never hardcoded here.

[alembic]
# Path to the migrations directory, relative to this file.
script_location = alembic

# Jinja2 template used when generating new revision files.
# %(here)s is the directory containing alembic.ini.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Encoding for migration scripts.
prepend_sys_path = .

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
