services:
  postgres:
    image: postgres:15-alpine
    container_name: aurenix_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-aurenix_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurenix} -d ${POSTGRES_DB:-aurenix_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurenix_internal

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aurenix_qdrant_prod
    restart: unless-stopped
    volumes:
      - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurenix_internal

  redis:
    image: redis:7-alpine
    container_name: aurenix_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurenix_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurenix_backend_prod
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    env_file:
      - ./backend/.env.production
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aurenix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurenix_db}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurenix_internal
      - aurenix_public
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurenix_frontend_prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.aurenix.ai/api/v1}
    depends_on:
      backend:
        condition: service_started
    networks:
      - aurenix_public
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_prod_data:
  qdrant_prod_data:
  redis_prod_data:

networks:
  aurenix_internal:
    internal: true
  aurenix_public:
    driver: bridge
